# Broker MQTT do HorangoTango Park — Eclipse Mosquitto 2.1 (docker compose)
# Sobe com `docker compose up -d` na raiz do repositório.

# MQTT (ESP32, backend, mosquitto_sub)
listener 1883
protocol mqtt

# WebSocket (MQTTX Web, painel da N1)
listener 9001
protocol websockets

# Sem conexão anônima: todo cliente usa usuário e senha (CP12, R9)
allow_anonymous false

# Usuários e senhas: arquivo gerado na subida a partir do .env (iniciar.sh)
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/data/passwd

# Quem pode publicar/assinar o quê (ver o arquivo acl)
plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/data/acl

# Guarda mensagens retidas (estado das vagas, status) entre reinícios
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
