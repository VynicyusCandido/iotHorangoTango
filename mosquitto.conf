# Escuta em todas as interfaces, porta padrao MQTT
listener 1883 0.0.0.0
 
# WebSocket (usado pelo app web em app/index.html)
listener 9001 0.0.0.0
protocol websockets
 
# Permite conexao sem usuario/senha (apenas para testes/faculdade)
allow_anonymous true
 
# Log detalhado no terminal (ajuda a ver CONNECT / SUBSCRIBE / PUBLISH)
log_type all
log_dest stdout
 
