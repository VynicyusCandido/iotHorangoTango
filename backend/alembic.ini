# Migrações do banco (R5). A URL vem de DATABASE_URL.
#   alembic upgrade head                      aplica (o serviço "migracoes" do compose faz isso)
#   alembic revision --autogenerate -m "..."  cria uma nova a partir de comum/modelos.py
[alembic]
script_location = migracoes
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
