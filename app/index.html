<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vagas Livres</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #e3e5ea;
    --livre: #16a34a;
    --livre-bg: #e8f7ee;
    --ocupada: #dc2626;
    --ocupada-bg: #fdecec;
    --aviso: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a;
      --card: #1a1f28;
      --text: #e8eaf0;
      --muted: #9aa1ad;
      --border: #2a303b;
      --livre: #34d399;
      --livre-bg: #12291f;
      --ocupada: #f87171;
      --ocupada-bg: #2f1617;
      --aviso: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.25rem; margin: 0; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
  .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--aviso); }
  .status.on::before { background: var(--livre); }
  .status.off::before { background: var(--ocupada); }

  .resumo {
    margin: 20px 0;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: center;
  }
  .resumo .num { font-size: 3rem; font-weight: 700; color: var(--livre); line-height: 1; }
  .resumo .num.zero { color: var(--ocupada); }
  .resumo .txt { color: var(--muted); margin-top: 6px; }

  .filtro { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: .9rem; }

  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .vaga {
    padding: 16px;
    border-radius: 12px;
    border: 2px solid var(--livre);
    background: var(--livre-bg);
  }
  .vaga.ocupada { border-color: var(--ocupada); background: var(--ocupada-bg); }
  .vaga .nome { font-weight: 600; }
  .vaga .estado { font-size: 1.1rem; font-weight: 700; color: var(--livre); margin: 4px 0; }
  .vaga.ocupada .estado { color: var(--ocupada); }
  .vaga .hora { font-size: .75rem; color: var(--muted); }

  .vazio { color: var(--muted); text-align: center; padding: 32px 8px; }

  details {
    margin-top: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
  }
  summary { cursor: pointer; color: var(--muted); }
  label { display: block; margin-top: 12px; font-size: .85rem; color: var(--muted); }
  input[type=text] {
    width: 100%;
    margin-top: 4px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  button {
    margin-top: 14px;
    padding: 8px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--text);
    color: var(--bg);
    font: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Vagas da garagem</h1>
    <span id="status" class="status">conectando…</span>
  </header>

  <section class="resumo">
    <div id="numLivres" class="num">–</div>
    <div id="txtResumo" class="txt">aguardando dados do broker</div>
  </section>

  <div class="filtro">
    <input type="checkbox" id="soLivres">
    <label for="soLivres" style="margin:0">Mostrar só vagas livres</label>
  </div>

  <section id="grade" class="grade"></section>
  <div id="vazio" class="vazio">Nenhuma vaga recebida ainda.</div>

  <details>
    <summary>Configurações</summary>
    <label>Broker (WebSocket)
      <input type="text" id="cfgBroker" placeholder="wss://broker.hivemq.com:8884/mqtt">
    </label>
    <label>Prefixo do tópico (igual ao dos sketches)
      <input type="text" id="cfgPrefixo" placeholder="garagem/vaga">
    </label>
    <button id="btnSalvar">Salvar e reconectar</button>
  </details>
</main>

<script>
  const PADRAO = {
    broker: "wss://broker.hivemq.com:8884/mqtt",
    prefixo: "garagem/vaga",
  };

  // Configuração: parâmetros da URL (?broker=...&prefixo=...) > localStorage > padrão
  function lerConfig() {
    let salvo = {};
    try { salvo = JSON.parse(localStorage.getItem("vagas-config") || "{}"); } catch (e) {}
    const url = new URLSearchParams(location.search);
    return {
      broker: url.get("broker") || salvo.broker || PADRAO.broker,
      prefixo: (url.get("prefixo") || salvo.prefixo || PADRAO.prefixo).replace(/\/+$/, ""),
    };
  }

  const vagas = new Map(); // número da vaga -> { ocupada, hora }
  let cliente = null;
  let config = lerConfig();

  const el = (id) => document.getElementById(id);

  function setStatus(texto, classe) {
    el("status").textContent = texto;
    el("status").className = "status " + (classe || "");
  }

  function render() {
    const soLivres = el("soLivres").checked;
    const lista = [...vagas.entries()].sort((a, b) => a[0] - b[0]);
    const livres = lista.filter(([, v]) => !v.ocupada).length;

    el("numLivres").textContent = lista.length ? livres : "–";
    el("numLivres").classList.toggle("zero", lista.length > 0 && livres === 0);
    el("txtResumo").textContent = lista.length
      ? (livres === 1 ? "vaga livre" : "vagas livres") + ` de ${lista.length}`
      : "aguardando dados do broker";

    const visiveis = lista.filter(([, v]) => !soLivres || !v.ocupada);
    el("grade").innerHTML = visiveis.map(([n, v]) => `
      <div class="vaga ${v.ocupada ? "ocupada" : ""}">
        <div class="nome">Vaga ${n}</div>
        <div class="estado">${v.ocupada ? "Ocupada" : "Livre"}</div>
        <div class="hora">atualizado ${v.hora.toLocaleTimeString("pt-BR")}</div>
      </div>`).join("");

    el("vazio").style.display = visiveis.length ? "none" : "block";
    el("vazio").textContent = lista.length ? "Nenhuma vaga livre no momento." : "Nenhuma vaga recebida ainda.";
  }

  function conectar() {
    if (cliente) cliente.end(true);
    vagas.clear();
    render();
    setStatus("conectando…");

    const topico = config.prefixo + "/#";
    cliente = mqtt.connect(config.broker, {
      clientId: "app-vagas-" + Math.random().toString(16).slice(2, 10),
      reconnectPeriod: 3000,
    });

    cliente.on("connect", () => {
      setStatus("online", "on");
      cliente.subscribe(topico); // retained: já recebe o último estado de cada vaga
    });
    cliente.on("reconnect", () => setStatus("reconectando…"));
    cliente.on("offline", () => setStatus("offline", "off"));
    cliente.on("error", (err) => { console.error(err); setStatus("erro", "off"); });

    cliente.on("message", (t, payload) => {
      // Tópico esperado: <prefixo>/<número>
      const numero = parseInt(t.slice(config.prefixo.length + 1), 10);
      if (!Number.isInteger(numero) || numero < 1) return;

      const msg = payload.toString().trim().toLowerCase();
      if (msg === "") {
        vagas.delete(numero); // retained apagado: vaga removida
      } else if (msg === "livre" || msg === "ocupada") {
        vagas.set(numero, { ocupada: msg === "ocupada", hora: new Date() });
      } else {
        return;
      }
      render();
    });
  }

  el("soLivres").addEventListener("change", render);

  el("cfgBroker").value = config.broker;
  el("cfgPrefixo").value = config.prefixo;
  el("btnSalvar").addEventListener("click", () => {
    const novo = {
      broker: el("cfgBroker").value.trim() || PADRAO.broker,
      prefixo: (el("cfgPrefixo").value.trim() || PADRAO.prefixo).replace(/\/+$/, ""),
    };
    try { localStorage.setItem("vagas-config", JSON.stringify(novo)); } catch (e) {}
    config = novo;
    conectar();
  });

  conectar();
</script>
</body>
</html>
